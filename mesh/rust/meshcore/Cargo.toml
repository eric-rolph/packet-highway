[package]
name = "meshcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport-agnostic P2P mesh routing + crypto core. No FFI, no platform code."

[dependencies]
# Deliberately tiny. Every dependency here ships in the .a/.so that Apple and
# Google will scan, so the bar is: no C dependencies, no OpenSSL, no tokio.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"

[dev-dependencies]
# nothing — tests use std only

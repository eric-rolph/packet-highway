[package]
name = "meshcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport-agnostic P2P mesh routing + crypto core. No FFI, no platform code."

[dependencies]
# Deliberately tiny. Every dependency here ships in the .a/.so that Apple and
# Google will scan, so the bar is: no C dependencies, no OpenSSL, no tokio.
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
getrandom = "0.2"
ed25519-dalek = "2"
# Already in the tree via curve25519-dalek, so this adds no new supply chain.
# Pulled in explicitly because sender-chain keys are raw `[u8; 32]` that we have
# to erase by hand — and a hand-rolled memset is exactly the thing an optimiser
# deletes out from under you.
zeroize = "1"

[dev-dependencies]
# nothing — tests use std only

language = "C"
header = "/* Generated by cbindgen from meshcore-ffi. Do not edit by hand. */"
include_guard = "MESHCORE_H"
pragma_once = true
autogen_warning = "/* WARNING: regenerate with `cargo build -p meshcore-ffi`. */"
cpp_compat = true          # wraps in extern "C" {} so the JSI C++ layer can include it
documentation = true
documentation_style = "doxy"
line_length = 100
tab_width = 4
style = "type"

[export]
# No `prefix` — every exported type is already namespaced with `Mesh`, and
# adding one here produces `MeshMeshStatus`.
include = ["MeshStatus", "MeshBuffer", "MeshConfig", "MeshPlatformRadio", "MeshHandle"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
